<div class="outer" [ngClass]="{ 'full':!enrolledUsers.data.length  }">
<div class="enrolled-users-container" >
    <h2>Enrolled Users    <button *ngIf="enrolledUsers.data.length" class="btn" mat-raised-button color="accent" (click)="scrollToChart()">View As Chart</button></h2>
 
    <input *ngIf="enrolledUsers.data.length" type="text" placeholder="Search..." [formControl]="searchControl" />
    
  
    <table *ngIf="enrolledUsers.data.length" mat-table matSort [dataSource]="enrolledUsers" class="mat-elevation-z8">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Username </th>
        <td mat-cell *matCellDef="let user"> {{ user.username }} </td>
      </ng-container>
  
      <ng-container matColumnDef="courseName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Course Name </th>
        <td mat-cell *matCellDef="let user"> {{ user.courseName }} </td>
      </ng-container>
  
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let user"> {{ user.status }} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  
    <mat-paginator [ngClass]="{'hide':!enrolledUsers.data.length}"  [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    <div *ngIf="!enrolledUsers.data.length" >
     
      <h1 > No records yet </h1>
    </div>

  </div>
    


  <div *ngIf="enrolledUsers.data.length" class="chart" #chart>
    <mat-card class="card">
      <app-enrollment-chart></app-enrollment-chart>
    </mat-card>
  </div>

</div>
