<div class="outer">
<mat-card class="quiz-container">
  <mat-card-title>Create a New Quiz</mat-card-title>
  
  <form [formGroup]="quizForm" (ngSubmit)="submitQuiz()">
    <div class="form-section">
      <mat-form-field appearance="outline">
        <mat-label>Select Course</mat-label>
        <mat-select formControlName="courseid">
          <mat-option *ngFor="let course of courses" [value]="course.courseid">
            {{ course.coursename }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Quiz Title</mat-label>
        <input matInput formControlName="title" placeholder="Enter quiz title" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>
    </div>

    <div class="question-section">
      <div formArrayName="questions">
        <div *ngFor="let question of questions.controls; let i = index" [formGroupName]="i" class="question-block">
          <mat-form-field appearance="outline">
            <mat-label>Question {{ i + 1 }}</mat-label>
            <textarea matInput formControlName="questionText" placeholder="Enter question" rows="5"></textarea>
          </mat-form-field>

          <div formArrayName="answers">
            <div *ngFor="let answer of $any(question.get('answers')).controls; let j = index" [formGroupName]="j" class="answer-block">
              <mat-form-field appearance="outline">
                <mat-label>Answer {{ j + 1 }}</mat-label>
                <input matInput formControlName="answerText" placeholder="Enter answer" />
              </mat-form-field>
            </div>
          </div>

          <mat-form-field appearance="outline">
            <mat-label>Correct Answer</mat-label>
            <mat-icon class="icon">check_circle</mat-icon>

            <mat-select formControlName="correctAnswerIndex">
              <mat-option *ngFor="let answer of $any(question.get('answers')).controls; let j = index" [value]="j">
                Answer {{ j + 1 }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <button mat-icon-button color="warn" (click)="removeQuestion(i)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <button mat-button color="primary" (click)="addQuestion()">+ Add Question</button>
    </div>

    <button mat-raised-button color="accent" type="submit">Submit Quiz</button>
  </form>
</mat-card>
</div>
